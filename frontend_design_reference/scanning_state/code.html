<!DOCTYPE html><html lang="en" class="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#68dba9",
                        "secondary": "#645d58",
                        "on-primary-fixed": "#131b2e",
                        "on-secondary": "#ffffff",
                        "primary-container": "#131b2e",
                        "secondary-container": "#eae1da",
                        "on-tertiary-container": "#069669",
                        "inverse-surface": "#2f3130",
                        "on-primary-fixed-variant": "#3f465c",
                        "inverse-primary": "#bec6e0",
                        "tertiary": "#000000",
                        "tertiary-fixed": "#85f8c4",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1a1c1c",
                        "on-primary-container": "#7c839b",
                        "on-error": "#ffffff",
                        "outline-variant": "#c6c6cd",
                        "surface-container": "#eeeeed",
                        "on-background": "#1a1c1c",
                        "background": "#f9f9f8",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#002114",
                        "on-secondary-fixed": "#1f1b17",
                        "surface-container-high": "#e8e8e7",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#eae1da",
                        "surface-bright": "#f9f9f8",
                        "error": "#ba1a1a",
                        "primary-fixed": "#dae2fd",
                        "on-tertiary-fixed-variant": "#005137",
                        "surface-variant": "#e2e2e2",
                        "surface": "#f9f9f8",
                        "surface-container-highest": "#e2e2e2",
                        "on-surface-variant": "#45464d",
                        "tertiary-container": "#002114",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#4b4641",
                        "inverse-on-surface": "#f1f1f0",
                        "surface-tint": "#565e74",
                        "outline": "#76777d",
                        "primary-fixed-dim": "#bec6e0",
                        "primary": "#000000",
                        "surface-dim": "#dadad9",
                        "surface-container-low": "#f3f4f3",
                        "on-secondary-container": "#6a635e",
                        "secondary-fixed-dim": "#cec5bf"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-mobile": "20px",
                        "margin-desktop": "80px",
                        "gutter": "16px",
                        "touch-target": "44px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "price-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "price-display": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "price-sm": ["14px", { "lineHeight": "1", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "price-display": ["18px", { "lineHeight": "1", "fontWeight": "600" }]
                    }
                }
            }
        }
    }catch(_e){}</script></head><body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased selection:bg-primary selection:text-on-primary">

    <!-- TopAppBar -->
    <header class="w-full top-0 sticky bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant z-40">
        <div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4">
            <button class="flex items-center justify-center w-touch-target h-touch-target hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200 rounded-full text-primary dark:text-primary-fixed-dim" aria-label="Menu">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
            </button>
            
            <h1 class="font-headline-md text-headline-md font-semibold text-primary dark:text-on-primary-fixed">Quotation Manager</h1>
            
            <button class="flex items-center justify-center h-touch-target px-4 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200 rounded-full text-primary dark:text-primary-fixed-dim" aria-label="Current Total">
                <span class="font-price-display text-price-display">RM0.00</span>
            </button>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
        
        <!-- Camera Viewfinder (Simulated) -->
        <div class="w-full max-w-[400px] aspect-[3/4] relative bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-[0px_10px_30px_rgba(0,0,0,0.04)] mb-8">
            
            <!-- Simulated Camera Feed Background -->
            <div class="absolute inset-0 bg-surface-container-low flex items-center justify-center">
                 <span class="material-symbols-outlined text-outline text-6xl opacity-20">qr_code_scanner</span>
            </div>
            
            <!-- Scanner Overlay -->
            <div class="absolute inset-0 pointer-events-none">
                <!-- Corner Reticles -->
                <div class="absolute top-8 left-8 w-12 h-12 border-t-2 border-l-2 border-primary"></div>
                <div class="absolute top-8 right-8 w-12 h-12 border-t-2 border-r-2 border-primary"></div>
                <div class="absolute bottom-8 left-8 w-12 h-12 border-b-2 border-l-2 border-primary"></div>
                <div class="absolute bottom-8 right-8 w-12 h-12 border-b-2 border-r-2 border-primary"></div>
                
                <!-- Scanning Line -->
                <div class="absolute top-1/4 left-8 right-8 h-[2px] bg-primary scanner-line shadow-[0_0_8px_rgba(0,0,0,0.5)]"></div>
            </div>
            
            <!-- Scanning Status Indicator -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-surface/90 backdrop-blur-sm border border-outline-variant rounded-full px-6 py-3 flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-primary animate-pulse"></div>
                <span class="font-label-caps text-label-caps text-on-surface">SCANNING...</span>
            </div>
        </div>

        <!-- Instructional Text -->
        <div class="text-center max-w-sm mb-12">
            <h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Hold steady over price tag</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">Ensure barcode or model number is clearly visible within the frame.</p>
        </div>

        <!-- Scanning State Button -->
        <div class="relative w-full max-w-[280px]">
            <!-- Pulse Ring Background -->
            <div class="absolute inset-0 rounded-full border border-primary pulse-ring"></div>
            
            <button class="w-full h-14 bg-surface-container-lowest border border-outline-variant text-on-surface font-label-caps text-label-caps rounded-full flex items-center justify-center gap-3 relative z-10 opacity-70 cursor-not-allowed">
                <span class="material-symbols-outlined animate-spin" style="font-variation-settings: 'FILL' 0;">progress_activity</span>
                PROCESSING...
            </button>
        </div>
        
    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center bg-surface dark:bg-surface h-touch-target border-t border-outline-variant dark:border-outline-variant z-50 md:hidden pb-safe">
        
        <!-- Active Tab: Capture -->
        <a href="#" class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim border-t-2 border-primary dark:border-primary-fixed-dim pt-2 w-full h-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
            <span class="font-label-caps text-label-caps">Capture</span>
        </a>

        <!-- Inactive Tab: Items -->
        <a href="#" class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim pt-2 w-full h-full hover:text-primary dark:hover:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">list_alt</span>
            </a></nav></body></html>
