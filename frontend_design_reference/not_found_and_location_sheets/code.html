<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>High-End Quotation Manager - Bottom Sheets</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed-dim": "#68dba9",
                      "secondary": "#645d58",
                      "on-primary-fixed": "#131b2e",
                      "on-secondary": "#ffffff",
                      "primary-container": "#131b2e",
                      "secondary-container": "#eae1da",
                      "on-tertiary-container": "#069669",
                      "inverse-surface": "#2f3130",
                      "on-primary-fixed-variant": "#3f465c",
                      "inverse-primary": "#bec6e0",
                      "tertiary": "#000000",
                      "tertiary-fixed": "#85f8c4",
                      "on-tertiary": "#ffffff",
                      "on-surface": "#1a1c1c",
                      "on-primary-container": "#7c839b",
                      "on-error": "#ffffff",
                      "outline-variant": "#c6c6cd",
                      "surface-container": "#eeeeed",
                      "on-background": "#1a1c1c",
                      "background": "#f9f9f8",
                      "error-container": "#ffdad6",
                      "on-tertiary-fixed": "#002114",
                      "on-secondary-fixed": "#1f1b17",
                      "surface-container-high": "#e8e8e7",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#eae1da",
                      "surface-bright": "#f9f9f8",
                      "error": "#ba1a1a",
                      "primary-fixed": "#dae2fd",
                      "on-tertiary-fixed-variant": "#005137",
                      "surface-variant": "#e2e2e2",
                      "surface": "#f9f9f8",
                      "surface-container-highest": "#e2e2e2",
                      "on-surface-variant": "#45464d",
                      "tertiary-container": "#002114",
                      "on-error-container": "#93000a",
                      "on-secondary-fixed-variant": "#4b4641",
                      "inverse-on-surface": "#f1f1f0",
                      "surface-tint": "#565e74",
                      "outline": "#76777d",
                      "primary-fixed-dim": "#bec6e0",
                      "primary": "#000000",
                      "surface-dim": "#dadad9",
                      "surface-container-low": "#f3f4f3",
                      "on-secondary-container": "#6a635e",
                      "secondary-fixed-dim": "#cec5bf"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "margin-mobile": "20px",
                      "margin-desktop": "80px",
                      "gutter": "16px",
                      "touch-target": "44px"
              },
              "fontFamily": {
                      "display-lg": ["Inter"],
                      "label-caps": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "price-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "price-display": ["Inter"]
              },
              "fontSize": {
                      "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                      "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                      "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                      "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                      "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "price-sm": ["14px", { "lineHeight": "1", "fontWeight": "500" }],
                      "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                      "price-display": ["18px", { "lineHeight": "1", "fontWeight": "600" }]
              }
      },
          },
        }
      </script>
<style>
        .sheet-shadow {
            box-shadow: 0px -10px 30px rgba(0,0,0,0.04);
        }
        /* Custom scrollbar for minimalist look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e2e2;
            border-radius: 4px;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-8 gap-8 flex-wrap font-body-md text-on-surface antialiased">
<!-- Screen 1: Not-Found Sheet Context -->
<div class="w-[390px] h-[844px] bg-background relative overflow-hidden shadow-2xl rounded-xl border border-outline-variant flex flex-col">
<!-- Mock Top App Bar (Background context) -->
<header class="flex justify-between items-center px-margin-mobile py-4 bg-surface border-b border-outline-variant z-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="font-headline-md text-headline-md font-semibold text-primary">Quotation Manager</h1>
</div>
<span class="font-price-display text-price-display text-primary">$0.00</span>
</header>
<!-- Mock Content -->
<div class="flex-1 p-margin-mobile flex flex-col gap-4">
<div class="h-24 bg-surface-container-highest rounded border border-outline-variant opacity-50"></div>
<div class="h-24 bg-surface-container-highest rounded border border-outline-variant opacity-50"></div>
</div>
<!-- Scrim -->
<div class="absolute inset-0 bg-tertiary/20 z-40 transition-opacity"></div>
<!-- NOT-FOUND BOTTOM SHEET -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-[16px] border-t border-outline-variant sheet-shadow z-50 flex flex-col max-h-[751px]">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-2 cursor-grab">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pb-6 flex-1 overflow-hidden flex flex-col">
<!-- Header & Calm Warning -->
<div class="mb-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Item not recognized</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-start gap-2">
<span class="material-symbols-outlined text-[18px] mt-0.5">info</span>
                        The scanned QR code could not be matched automatically. Please search the catalogue or add manually.
                    </p>
</div>
<!-- Search Input -->
<div class="mb-6">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Search Catalogue</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full h-touch-target pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:border-[1.5px] transition-all" placeholder="Enter SKU, Product Code or Name" type="text"/>
</div>
</div>
<!-- Scrollable Results -->
<div class="flex-1 overflow-y-auto min-h-[120px] mb-6">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 uppercase">Suggestions</label>
<div class="flex flex-col border-t border-outline-variant">
<!-- Result Item -->
<button class="flex items-center justify-between py-3 border-b border-outline-variant hover:bg-surface-container-lowest transition-colors text-left group">
<div class="flex flex-col">
<span class="font-price-sm text-price-sm text-on-surface-variant font-mono">AX-772-B</span>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Axor Starck Basin Mixer</span>
</div>
<span class="font-price-sm text-price-sm text-on-surface font-mono">$450.00</span>
</button>
<!-- Result Item -->
<button class="flex items-center justify-between py-3 border-b border-outline-variant hover:bg-surface-container-lowest transition-colors text-left group">
<div class="flex flex-col">
<span class="font-price-sm text-price-sm text-on-surface-variant font-mono">AX-772-C</span>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Axor Starck Tall Basin Mixer</span>
</div>
<span class="font-price-sm text-price-sm text-on-surface font-mono">$580.00</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-auto pt-4 bg-surface-container-lowest">
<button class="w-full h-touch-target bg-primary text-on-primary font-body-lg text-body-lg rounded flex items-center justify-center gap-2 hover:bg-on-surface transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
                        Add blank line
                    </button>
<button class="w-full h-touch-target bg-transparent border border-outline-variant text-primary font-body-lg text-body-lg rounded flex items-center justify-center gap-2 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
                        Retake photo
                    </button>
</div>
</div>
</div>
</div>
<!-- Screen 2: Location Sheet Context -->
<div class="w-[390px] h-[844px] bg-background relative overflow-hidden shadow-2xl rounded-xl border border-outline-variant flex flex-col">
<!-- Mock Top App Bar -->
<header class="flex justify-between items-center px-margin-mobile py-4 bg-surface border-b border-outline-variant z-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="font-headline-md text-headline-md font-semibold text-primary">Quotation Manager</h1>
</div>
<span class="font-price-display text-price-display text-primary">$12,450.00</span>
</header>
<!-- Mock Content -->
<div class="flex-1 p-margin-mobile flex flex-col gap-4">
<div class="p-4 bg-surface-container-lowest rounded border border-outline-variant flex justify-between items-center opacity-50">
<span class="font-body-md text-body-md">Current Zone: Unassigned</span>
<span class="material-symbols-outlined">edit_location</span>
</div>
</div>
<!-- Scrim -->
<div class="absolute inset-0 bg-tertiary/20 z-40 transition-opacity"></div>
<!-- LOCATION BOTTOM SHEET -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-[16px] border-t border-outline-variant sheet-shadow z-50 flex flex-col">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-2 cursor-grab">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pb-8 flex-1 flex flex-col">
<!-- Header -->
<div class="mb-6 flex justify-between items-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Set Location</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Input Fields -->
<div class="flex flex-col gap-4 mb-6">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Area</label>
<input class="w-full h-touch-target px-4 bg-surface-container-lowest border border-outline-variant rounded text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:border-[1.5px] transition-all" placeholder="e.g. Master Bathroom" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Sub-area (Optional)</label>
<input class="w-full h-touch-target px-4 bg-surface-container-lowest border border-outline-variant rounded text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:border-[1.5px] transition-all" placeholder="e.g. Shower Enclosure" type="text"/>
</div>
</div>
<!-- Previous Locations (Chips) -->
<div class="mb-8">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 uppercase">Recent Locations</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 border border-outline-variant rounded-full text-body-md text-on-surface-variant hover:border-primary hover:text-primary transition-colors bg-surface-container-lowest">
                            Guest WC
                        </button>
<button class="px-4 py-2 border border-outline-variant rounded-full text-body-md text-on-surface-variant hover:border-primary hover:text-primary transition-colors bg-surface-container-lowest">
                            Kitchen Island
                        </button>
<button class="px-4 py-2 border border-outline-variant rounded-full text-body-md text-on-surface-variant hover:border-primary hover:text-primary transition-colors bg-surface-container-lowest">
                            Staff Restroom
                        </button>
<button class="px-4 py-2 border border-outline-variant rounded-full text-body-md text-on-surface-variant hover:border-primary hover:text-primary transition-colors bg-surface-container-lowest">
                            Utility Room
                        </button>
</div>
</div>
<!-- Actions -->
<div class="flex gap-4 mt-auto">
<button class="flex-1 h-touch-target bg-transparent text-on-surface-variant font-body-lg text-body-lg rounded flex items-center justify-center hover:bg-surface-container transition-colors">
                        Cancel
                    </button>
<button class="flex-[2] h-touch-target bg-primary text-on-primary font-body-lg text-body-lg rounded flex items-center justify-center hover:bg-on-surface transition-colors">
                        Set location
                    </button>
</div>
</div>
</div>
</div>
</body></html>
